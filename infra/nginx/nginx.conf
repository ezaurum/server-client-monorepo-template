# /etc/nginx/nginx.conf 또는 /etc/nginx/sites-enabled/default
events {
    worker_connections 1024; # 최대 동시 연결 수
}

http {
    # 선택 사항: upstream을 정의하여 백엔드 주소를 명확하게 분리할 수 있습니다.
    upstream server_backend {
        # Docker 환경에서 호스트 머신의 API 서버
        server host.docker.internal:3939;
    }

    upstream client_backend {
        # Docker 환경에서 호스트 머신의 Vue 서버
        server host.docker.internal:9990;
    }

    # 웹소켓 프록시에 필요한 공통 설정 (http 블록 내부에 정의)
    # 이 설정은 모든 server 블록에 적용될 수 있도록 http 블록에 두는 것이 좋습니다.
    map $http_upgrade $connection_upgrade {
            default upgrade;
            ''      close;
    }


    # api.dev.local에 대한 서버 블록
    server {
        listen 443 ssl;
        server_name api.dev.local;

        # mkcert로 생성된 와일드카드 인증서 경로를 정확히 지정하세요.
        ssl_certificate /etc/nginx/certs/_wildcard.dev.local+4.pem; # mkcert로 생성된 인증서 파일
        ssl_certificate_key /etc/nginx/certs/_wildcard.dev.local+4-key.pem; # mkcert로 생성된 인증서 키 파일

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5; # 권장 SSL 암호화 스위트

        location / {
            proxy_pass http://server_backend; # 정의된 upstream 사용
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 100M; # 업로드 파일 크기 제한 (필요시 조정)
        }
    }

    # dev.local에 대한 서버 블록
    server {
        server_name dev.local;
        listen 443 ssl;

        # mkcert로 생성된 와일드카드 인증서 경로를 정확히 지정하세요.
        ssl_certificate /etc/nginx/certs/_wildcard.dev.local+4.pem; # mkcert로 생성된 인증서 파일
        ssl_certificate_key /etc/nginx/certs/_wildcard.dev.local+4-key.pem; # mkcert로 생성된 인증서 키 파일

        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_prefer_server_ciphers on;
        ssl_ciphers HIGH:!aNULL:!MD5; # 권장 SSL 암호화 스위트

        location / {
           proxy_pass http://client_backend; # 정의된 upstream 사용
           proxy_set_header Host $host;
           proxy_set_header X-Real-IP $remote_addr;
           proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
           proxy_set_header X-Forwarded-Proto $scheme;
           client_max_body_size 100M; # 업로드 파일 크기 제한 (필요시 조정)
        }
    }
}
